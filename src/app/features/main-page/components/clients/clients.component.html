<h4 class="styled-header">skills</h4>
<div dir="ltr">
  <p-carousel
  
    [responsiveOptions]="responsiveOptions"
    [value]="data"
    [numVisible]="6"
    [numScroll]="1"
    [showNavigators]="false"
  >
    <ng-template let-item pTemplate="item">
      <span [class]=" 'item icon '+ item"></span>
    </ng-template>
  </p-carousel>
</div>
