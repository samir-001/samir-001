<h4 class="styled-header">testimonial</h4>
<div dir="ltr">
  <p-carousel
    [responsiveOptions]="responsiveOptions"
    [value]="test"
    [numVisible]="2"
    [numScroll]="1"
    [showNavigators]="false"
  >
    <ng-template let-item pTemplate="item">
      <app-testimonial-card [testimonial]="item"></app-testimonial-card>
    </ng-template>
  </p-carousel>
</div>
